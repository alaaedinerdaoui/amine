<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 770" width="700" height="770" style="background:#ffffff; font-family:'Alexandria', 'Cairo', -apple-system, sans-serif;">
  <!-- White clean page background with subtle border -->
  <rect width="700" height="770" fill="#ffffff" />
  
  <!-- Subtle header title -->
  <text x="350" y="32" font-size="15" font-weight="700" fill="#2d3748" text-anchor="middle" direction="rtl">
    تنامي الأدفاق التجارية العالمية يؤثر على الاقتصاد العالمي
  </text>

  <!-- Newton's Cradle Structure -->
  <g transform="translate(140, 50)">
    <!-- Base pedestal -->
    <rect x="0" y="240" width="420" height="14" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <rect x="20" y="235" width="380" height="5" fill="#cbd5e1" />
    
    <!-- Metal Frame -->
    <!-- Left vertical bar -->
    <rect x="35" y="10" width="8" height="225" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    <rect x="30" y="225" width="18" height="10" rx="2" fill="#94a3b8" />
    <!-- Right vertical bar -->
    <rect x="375" y="10" width="8" height="225" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    <rect x="370" y="225" width="18" height="10" rx="2" fill="#94a3b8" />
    <!-- Top horizontal bar -->
    <rect x="35" y="10" width="348" height="8" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" />
    
    <!-- Top support diagonal strut -->
    <line x1="39" y1="50" x2="80" y2="14" stroke="#94a3b8" stroke-width="2" />

    <!-- 1. Left swinging ball (Elevated out in motion) -->
    <!-- Swinging wire -->
    <line x1="105" y1="18" x2="-25" y2="120" stroke="#a1a1aa" stroke-width="1.5" />
    <!-- Yellow swinging circle -->
    <circle cx="-25" cy="120" r="28" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5" />
    <!-- Chart Growth Icon -->
    <g transform="translate(-39, 106) scale(0.9)">
      <path d="M3 24h24M6 18l6-6 5 5 7-9" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M19 8h5v5" fill="none" stroke="#ca8a04" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="7" y="19" width="3" height="5" fill="#ca8a04" />
      <rect x="13" y="15" width="3" height="9" fill="#ca8a04" />
      <rect x="19" y="11" width="3" height="13" fill="#ca8a04" />
    </g>

    <!-- 2. Hanging Ball: Pie Chart (حصة الناتج المحلي) -->
    <line x1="125" y1="18" x2="125" y2="185" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="125" cy="185" r="25" fill="#fffbeb" stroke="#b45309" stroke-width="2" />
    <g transform="translate(112, 172) scale(1.1)">
      <path d="M12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10 10 10 0 0 0 10-10" fill="none" stroke="#b45309" stroke-width="2" />
      <path d="M12 12L22 12A10 10 0 0 0 12 2v10z" fill="#b45309" opacity="0.3" stroke="#b45309" stroke-width="2" />
      <line x1="12" y1="12" x2="12" y2="22" stroke="#b45309" stroke-width="2" />
    </g>

    <!-- 3. Hanging Ball: Global FDI Network (الاستثمار الأجنبي المباشر) -->
    <line x1="180" y1="18" x2="180" y2="185" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="180" cy="185" r="25" fill="#fff1f2" stroke="#e11d48" stroke-width="2" />
    <g transform="translate(167, 172) scale(1.1)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#e11d48" stroke-width="2" />
      <path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20" fill="none" stroke="#e11d48" stroke-width="1.5" />
    </g>

    <!-- 4. Hanging Ball: Economic Openness Factory (الانفتاح الاقتصادي) -->
    <line x1="235" y1="18" x2="235" y2="185" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="235" cy="185" r="25" fill="#fdf4ff" stroke="#c026d3" stroke-width="2" />
    <g transform="translate(222, 172) scale(1.1)">
      <rect x="4" y="5" width="16" height="15" rx="1" fill="none" stroke="#c026d3" stroke-width="2" />
      <line x1="8" y1="10" x2="16" y2="10" stroke="#c026d3" stroke-width="2" />
      <line x1="8" y1="15" x2="16" y2="15" stroke="#c026d3" stroke-width="2" />
    </g>

    <!-- 5. Hanging Ball: Trade Liberalization Scales (تحرير التجارة) -->
    <line x1="290" y1="18" x2="290" y2="185" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="290" cy="185" r="25" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" />
    <g transform="translate(277, 172) scale(1.1)">
      <line x1="12" y1="4" x2="12" y2="20" stroke="#7c3aed" stroke-width="2" />
      <line x1="5" y1="7" x2="19" y2="7" stroke="#7c3aed" stroke-width="2" />
      <path d="M5 7l-3 7h6zM19 7l-3 7h6z" fill="none" stroke="#7c3aed" stroke-width="1.5" />
    </g>

    <!-- 6. Hanging Ball: Technical Communications Screen (العوامل التقنية) -->
    <line x1="345" y1="18" x2="345" y2="185" stroke="#a1a1aa" stroke-width="1.5" />
    <circle cx="345" cy="185" r="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
    <g transform="translate(332, 172) scale(1.1)">
      <rect x="3" y="4" width="18" height="13" rx="1.5" fill="none" stroke="#2563eb" stroke-width="2" />
      <circle cx="8" cy="9" r="1.5" fill="#2563eb" />
      <path d="M12 11l2-3 3 4" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <line x1="9" y1="20" x2="15" y2="20" stroke="#2563eb" stroke-width="2" />
      <line x1="12" y1="17" x2="12" y2="20" stroke="#2563eb" stroke-width="2" />
    </g>
  </g>

  <!-- Labels under the Newton cradle -->
  <!-- 1. العوامل التقنية (Far right in Arabic) -->
  <g transform="translate(565, 320)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle" direction="rtl">العوامل التقنية</text>
    <text x="0" y="14" font-size="8.5" fill="#64748b" text-anchor="middle" direction="rtl">تحسين النقل والاتصالات</text>
  </g>

  <!-- 2. تحرير التجارة -->
  <g transform="translate(480, 320)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="middle" direction="rtl">تحرير التجارة</text>
    <text x="0" y="14" font-size="8.5" fill="#64748b" text-anchor="middle" direction="rtl">تخفيض الرسوم الجمركية</text>
    <text x="0" y="24" font-size="8" fill="#64748b" text-anchor="middle" direction="rtl">والاتفاقيات</text>
  </g>

  <!-- 3. الانفتاح الاقتصادي -->
  <g transform="translate(390, 320)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#c026d3" text-anchor="middle" direction="rtl">الانفتاح الاقتصادي</text>
    <text x="0" y="14" font-size="8.5" fill="#64748b" text-anchor="middle" direction="rtl">سياسة التصنيع الحاث على</text>
    <text x="0" y="24" font-size="8" fill="#64748b" text-anchor="middle" direction="rtl">التصدير</text>
  </g>

  <!-- 4. الاستثمار الأجنبي المباشر -->
  <g transform="translate(295, 320)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="middle" direction="rtl">الاستثمار الأجنبي المباشر</text>
    <text x="0" y="14" font-size="8.5" fill="#64748b" text-anchor="middle" direction="rtl">زيادة فروع الشركات عبر</text>
    <text x="0" y="24" font-size="8" fill="#64748b" text-anchor="middle" direction="rtl">القطرية</text>
  </g>

  <!-- 5. حصة الناتج المحلي الإجمالي -->
  <g transform="translate(195, 320)">
    <text x="0" y="0" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle" direction="rtl">حصة الناتج المحلي</text>
    <text x="0" y="12" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle" direction="rtl">الإجمالي</text>
    <text x="0" y="24" font-size="8" fill="#64748b" text-anchor="middle" direction="rtl">زيادة حصة التجارة في الناتج</text>
    <text x="0" y="33" font-size="8" fill="#64748b" text-anchor="middle" direction="rtl">المحلي الإجمالي</text>
  </g>

  <!-- 6. الأدفاق التجارية -->
  <g transform="translate(100, 320)">
    <text x="0" y="0" font-size="10.5" font-weight="700" fill="#d97706" text-anchor="middle" direction="rtl">الأدفاق التجارية</text>
    <text x="0" y="14" font-size="8.5" fill="#64748b" text-anchor="middle" direction="rtl">نمو سريع في التجارة العالمية</text>
  </g>

  <!-- Divider Line -->
  <line x1="40" y1="410" x2="660" y2="410" stroke="#f1f5f9" stroke-width="2" />

  <!-- Section Title (II) -->
  <text x="660" y="445" font-size="19" font-weight="800" fill="#004e9a" text-anchor="start" direction="rtl">
    II) الاطراف المتدخلة في الادفاق التجارية العالمية
  </text>

  <!-- Sub-section 1/ -->
  <text x="660" y="480" font-size="16.5" font-weight="800" fill="#059669" text-anchor="start" direction="rtl">
    1/ الشركات عبر القطرية : المحرك الرئيسي للتجارة العالمية
  </text>

  <!-- Definition pink box -->
  <rect x="585" y="497" width="75" height="23" rx="4" fill="#fce7f3" stroke="#f472b6" stroke-width="1" />
  <text x="622" y="513" font-size="12" font-weight="800" fill="#9d174d" text-anchor="middle" direction="rtl">
    *تعريفها :
  </text>
  
  <text x="575" y="513" font-size="13" font-weight="700" fill="#1e293b" text-anchor="start" direction="rtl">
    هي شركة كبرى تمارس انشطتها مباشرة او عن طريق فروعها في الخارج مع الحفاظ على
  </text>
  <text x="660" y="534" font-size="13" font-weight="700" fill="#1e293b" text-anchor="start" direction="rtl">
    مقرها الاجتماعي في بلدها الاصلي
  </text>

  <!-- Paragraph 1 -->
  <text x="660" y="575" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">
    تعمل الشركات عبر القطرية على الاستفادة من فوارق كلفة الانتاج بين مناطق العالم بعولمة الاستثمار و
  </text>
  <text x="660" y="598" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">
    تجزئة مراحل الانتاج
  </text>

  <!-- Paragraph 2 -->
  <text x="660" y="635" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">
    تضاعف عدد الشركات الام قرابة 3مرات بين 1990 و 2018 واصبحت تعد 60الف بينما تضاعف عدد الفروع و
  </text>
  <text x="660" y="658" font-size="13.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">
    اصبح 500الف وينتمي ثلاثة ارباعها الى البلدان المتقدمة
  </text>

  <!-- Paragraph 3 (Conclusion ==>) -->
  <text x="660" y="695" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" direction="rtl">
    ==> تسيطر الشركات عبر القطرية على ثلثي الادفاق التجارية العالمية وهي تضغط على حكوماتها وعلى
  </text>
  <text x="660" y="718" font-size="13.5" font-weight="700" fill="#0f172a" text-anchor="start" direction="rtl">
    المنتديات الاقتصادية العالمية (منتدى دافوس ) وعلى المنظمة العالمية للتجارة لمزيد تحرير التجارة
  </text>
</svg>
