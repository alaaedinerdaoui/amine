<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 780" width="700" height="780" style="background:#ffffff; font-family:'Alexandria', 'Cairo', -apple-system, sans-serif;">
  <!-- White clean paper background -->
  <rect width="700" height="780" fill="#ffffff" />

  <!-- ==================== TOP DIAGRAM: COLD WAR DNA / CHAIN ==================== -->
  
  <!-- Central DNA Helix Structure -->
  <g transform="translate(350, 40)">
    <!-- Helix strands -->
    <!-- Rungs connecting the two strands -->
    <!-- Loop 1 (Top) -->
    <line x1="-30" y1="20" x2="30" y2="20" stroke="#71717a" stroke-width="2" />
    <circle cx="-30" cy="20" r="5" fill="#f87171" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="30" cy="20" r="5" fill="#60a5fa" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-42" y1="40" x2="42" y2="40" stroke="#71717a" stroke-width="2" />
    <circle cx="-42" cy="40" r="5" fill="#fb7185" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="42" cy="40" r="5" fill="#38bdf8" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-48" y1="65" x2="48" y2="65" stroke="#71717a" stroke-width="2" />
    <circle cx="-48" cy="65" r="5" fill="#f43f5e" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="48" cy="65" r="5" fill="#0284c7" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-42" y1="90" x2="42" y2="90" stroke="#71717a" stroke-width="2" />
    <circle cx="-42" cy="90" r="5" fill="#fda4af" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="42" cy="90" r="5" fill="#bae6fd" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-28" y1="110" x2="28" y2="110" stroke="#71717a" stroke-width="2" />
    <circle cx="-28" cy="110" r="5" fill="#f87171" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="28" cy="110" r="5" fill="#60a5fa" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Crossing junction 1 -->
    <circle cx="0" cy="130" r="4" fill="#3f3f46" />

    <!-- Loop 2 (Middle) -->
    <line x1="-28" y1="150" x2="28" y2="150" stroke="#71717a" stroke-width="2" />
    <circle cx="-28" cy="150" r="5" fill="#c084fc" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="28" cy="150" r="5" fill="#e879f9" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-42" y1="170" x2="42" y2="170" stroke="#71717a" stroke-width="2" />
    <circle cx="-42" cy="170" r="5" fill="#a855f7" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="42" cy="170" r="5" fill="#d946ef" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-48" y1="195" x2="48" y2="195" stroke="#71717a" stroke-width="2" />
    <circle cx="-48" cy="195" r="5" fill="#9333ea" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="48" cy="195" r="5" fill="#c026d3" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-42" y1="220" x2="42" y2="220" stroke="#71717a" stroke-width="2" />
    <circle cx="-42" cy="220" r="5" fill="#c084fc" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="42" cy="220" r="5" fill="#e879f9" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-28" y1="240" x2="28" y2="240" stroke="#71717a" stroke-width="2" />
    <circle cx="-28" cy="240" r="5" fill="#e9d5ff" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="28" cy="240" r="5" fill="#f5d0fe" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Crossing junction 2 -->
    <circle cx="0" cy="260" r="4" fill="#3f3f46" />

    <!-- Loop 3 (Bottom tail) -->
    <line x1="-28" y1="280" x2="28" y2="280" stroke="#71717a" stroke-width="2" />
    <circle cx="-28" cy="280" r="5" fill="#3b82f6" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="28" cy="280" r="5" fill="#06b6d4" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-42" y1="300" x2="42" y2="300" stroke="#71717a" stroke-width="2" />
    <circle cx="-42" cy="300" r="5" fill="#2563eb" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="42" cy="300" r="5" fill="#0891b2" stroke="#3f3f46" stroke-width="1.5" />

    <line x1="-36" y1="320" x2="36" y2="320" stroke="#71717a" stroke-width="2" />
    <circle cx="-36" cy="320" r="5" fill="#1d4ed8" stroke="#3f3f46" stroke-width="1.5" />
    <circle cx="36" cy="320" r="5" fill="#0e7490" stroke="#3f3f46" stroke-width="1.5" />

    <!-- Continuous sinusoidal strand curves -->
    <path d="M-30,20 Q-52,65 0,130 Q52,195 0,260 Q-48,300 -36,320" fill="none" stroke="#27272a" stroke-width="2.5" />
    <path d="M30,20 Q52,65 0,130 Q-52,195 0,260 Q48,300 36,320" fill="none" stroke="#27272a" stroke-width="2.5" />
  </g>

  <!-- ==================== MILESTONE 1 (TOP RIGHT): بداية القطيعة ==================== -->
  <g transform="translate(660, 80)">
    <!-- Broken bridge / wall icon -->
    <g transform="translate(-215, 0)">
      <path d="M5 25V5h10v10l5-3 5 3v-10h10v20" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M17 18l4 6-3 4" fill="none" stroke="#e11d48" stroke-width="2" />
    </g>
    <!-- Text -->
    <text x="0" y="5" font-size="13" font-weight="800" fill="#e11d48" text-anchor="start" direction="rtl">بداية القطيعة</text>
    <text x="0" y="24" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">خلافات حول مصير ألمانيا</text>
    <text x="0" y="39" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">وأوروبا الشرقية بدأت في ندوة</text>
    <text x="0" y="54" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">يالطا وتأكدت في ندوة بوتسدام</text>
  </g>

  <!-- ==================== MILESTONE 2 (TOP LEFT): التحالف الكبير ==================== -->
  <g transform="translate(260, 80)">
    <!-- Handshake / Alliance icon -->
    <g transform="translate(10, 0)">
      <path d="M4 14l6-6 6 6-6 6zM16 8l8 8-4 4-8-8z" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M2 18l6 6M20 6l6 6" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
    </g>
    <!-- Text -->
    <text x="-5" y="5" font-size="13" font-weight="800" fill="#64748b" text-anchor="start" direction="rtl">التحالف الكبير</text>
    <text x="-5" y="24" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">الولايات المتحدة والاتحاد</text>
    <text x="-5" y="39" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">السوفياتي كطرفين رئيسيين في</text>
    <text x="-5" y="54" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">التحالف ضد دول المحور</text>
  </g>

  <!-- ==================== MILESTONE 3 (MIDDLE RIGHT): نظرية جدانوف ==================== -->
  <g transform="translate(660, 215)">
    <!-- Ideological two blocs icon -->
    <g transform="translate(-215, 0)">
      <rect x="2" y="8" width="12" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="2" />
      <rect x="20" y="8" width="12" height="18" rx="2" fill="none" stroke="#a855f7" stroke-width="2" />
      <circle cx="8" cy="14" r="2" fill="#a855f7" />
      <circle cx="26" cy="14" r="2" fill="#a855f7" />
      <path d="M14 2q3-3 6 0" fill="none" stroke="#a855f7" stroke-width="1.5" />
    </g>
    <!-- Text -->
    <text x="0" y="5" font-size="13" font-weight="800" fill="#a855f7" text-anchor="start" direction="rtl">نظرية جدانوف</text>
    <text x="0" y="24" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">تقسيم العالم إلى كتلة اشتراكية</text>
    <text x="0" y="39" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">بزعامة الاتحاد السوفياتي وكتلة</text>
    <text x="0" y="54" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">رأسمالية بقيادة الولايات المتحدة</text>
  </g>

  <!-- ==================== MILESTONE 4 (MIDDLE LEFT): سياسة الاحتواء ==================== -->
  <g transform="translate(260, 215)">
    <!-- Shield icon -->
    <g transform="translate(10, 0)">
      <path d="M12 2l14 4v10c0 9-14 16-14 16S-2 25-2 16V6z" fill="none" stroke="#db2777" stroke-width="2.5" />
    </g>
    <!-- Text -->
    <text x="-5" y="5" font-size="13" font-weight="800" fill="#db2777" text-anchor="start" direction="rtl">سياسة الاحتواء</text>
    <text x="-5" y="24" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">تبني ترومان سياسة تطويق</text>
    <text x="-5" y="39" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">الاتحاد السوفياتي لمنع انتشار</text>
    <text x="-5" y="54" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">الشيوعية</text>
  </g>

  <!-- ==================== MILESTONE 5 (BOTTOM LEFT): الأبعاد المختلفة ==================== -->
  <g transform="translate(260, 360)">
    <!-- Directional crossroads / rivalry icon -->
    <g transform="translate(10, 0)">
      <path d="M14 28V6M6 10l8-8 8 8" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="0" y="10" width="10" height="7" rx="1" fill="none" stroke="#2563eb" stroke-width="1.5" />
      <rect x="18" y="10" width="10" height="7" rx="1" fill="none" stroke="#2563eb" stroke-width="1.5" />
    </g>
    <!-- Text -->
    <text x="-5" y="5" font-size="13" font-weight="800" fill="#2563eb" text-anchor="start" direction="rtl">الأبعاد المختلفة</text>
    <text x="-5" y="24" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">تسابق العملاقين لكسب الأنصار</text>
    <text x="-5" y="39" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">عبر الاختلاف الإيديولوجي</text>
    <text x="-5" y="54" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">والاقتصادي والجغراستراتيجي</text>
    <text x="-5" y="69" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" direction="rtl">والعسكري</text>
  </g>

  <!-- ==================== SECTION II (BOTTOM HALF) ==================== -->

  <!-- Section Title with soft light blue highlight background -->
  <rect x="240" y="472" width="425" height="34" rx="4" fill="#f0f7ff" />
  <text x="660" y="496" font-size="18" font-weight="800" fill="#004e9a" text-anchor="start" direction="rtl">
    II) من أزمات الحرب الباردة إلى التعايش السلمي :
  </text>

  <!-- 1) أزمة برلين 1948-1949 -->
  <text x="660" y="536" font-size="16.5" font-weight="800" fill="#16a34a" text-anchor="start" direction="rtl">
    1) أزمة برلين 1948-1949 :
  </text>

  <!-- Paragraph 1 -->
  <text x="660" y="566" font-size="12.8" font-weight="600" fill="#1e293b" text-anchor="start" direction="rtl">
    - أقدم الغرب ( الولايات الأمريكية + فرنسا + انقلترا ) على إصدار عملة جديدة في ألمانيا دون
  </text>
  <text x="660" y="589" font-size="12.8" font-weight="600" fill="#1e293b" text-anchor="start" direction="rtl">
    استشارة الإتحاد السوفياتي فرد هذا الأخير <tspan font-weight="800" fill="#000000">بحصار بري</tspan> على برلين الغربية لكن الأمريكيين تمكنوا من
  </text>
  <text x="660" y="612" font-size="12.8" font-weight="600" fill="#1e293b" text-anchor="start" direction="rtl">
    افشال هذا الحصار بإقامة جسر جوي
  </text>

  <!-- Highlight box for Berlin division outcome -->
  <rect x="35" y="628" width="630" height="48" rx="3" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="655" y="648" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" direction="rtl">
    - أدت هذه الأزمة إلى تقسيم ألمانيا إلى دولتين : فدرالية رأسمالية في الغرب + ديمقراطية اشتراكية في
  </text>
  <text x="655" y="668" font-size="12.8" font-weight="700" fill="#1e293b" text-anchor="start" direction="rtl">
    الشرق
  </text>

  <!-- 2) حرب الكوريتين :1950-1953 -->
  <text x="660" y="718" font-size="16.5" font-weight="800" fill="#16a34a" text-anchor="start" direction="rtl">
    2) حرب الكوريتين :1950-1953 :
  </text>
</svg>
